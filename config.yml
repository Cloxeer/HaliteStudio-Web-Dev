  legalPages:
    privacy:
      lastUpdated: June 27, 2026
      intro: Halite WebDev ("we," "us," or "our") respects your privacy. This policy
        explains what information we collect, how we use it, and your choices.
        We are a small studio operated by Sebastian Salgado in Las Cruces, New
        Mexico.
      sections:
        - heading: Information we collect
          paragraphs:
            - When you contact us through our website form, email, or phone, we
              may collect your name, business name, email address, phone number,
              website or social links you provide, and any message you send us.
            - When we build or host your website, we may also process business
              content you provide (text, images, logos) and basic analytics data
              such as page views and device type, if analytics are enabled on
              your site.
        - heading: How we use your information
          paragraphs:
            - We use your information to respond to inquiries, provide quotes,
              build and maintain your website, send invoices, and deliver
              ongoing website care if you subscribe to a maintenance or monthly
              plan.
            - We do not sell your personal information. We do not use your data
              for unrelated advertising.
        - heading: Form submissions
          paragraphs:
            - Our contact form is delivered through a third-party form service
              (FormSubmit) that forwards submissions to our email. That provider
              may process submission data according to its own privacy policy.
        - heading: Hosting and client sites
          paragraphs:
            - Client websites may be hosted through third-party providers (such
              as Vercel or similar services). Those providers process technical
              data (IP addresses, request logs) as part of normal hosting
              operations.
            - If your site includes a contact form, form submissions may be
              processed by the form provider configured for your project.
        - heading: Data retention
          paragraphs:
            - We keep client project files, contracts, and correspondence as
              long as needed to provide services and meet legal or accounting
              obligations. You may request deletion of non-essential personal
              data after your project ends, subject to records we must retain.
        - heading: Your rights
          paragraphs:
            - You may request access to, correction of, or deletion of personal
              information we hold about you by emailing salsalgadonm@gmail.com.
              We will respond within a reasonable time.
        - heading: Contact
          paragraphs:
            - "Questions about this policy: Sebastian Salgado, Halite WebDev,
              Las Cruces, NM — salsalgadonm@gmail.com or (505) 373-9851."
    terms:
      lastUpdated: June 27, 2026
      intro: These Terms of Service ("Terms") govern your use of the Halite WebDev
        website (halitewebdev.com and related pages) and your relationship with
        us when you hire us for a project. We keep this in plain language so you
        know what to expect. Halite WebDev is operated by Sebastian Salgado. By
        using our site or working with us, you agree to these Terms.
      sections:
        - heading: Who we are
          paragraphs:
            - Halite WebDev is a small web design studio operated by Sebastian
              Salgado, an individual based in Las Cruces, New Mexico. When we
              say "we," "us," or "Halite" in these Terms, we mean Halite
              WebDev—not a large agency or anonymous support team. You work
              directly with Sebastian on your project.
        - heading: Website use
          paragraphs:
            - You may use our website for lawful purposes only. You may not
              attempt to disrupt the site, scrape it for abuse, or misrepresent
              your identity when contacting us.
            - Content on this site (text, design, branding) is owned by Halite
              WebDev unless otherwise noted. You may not copy our marketing
              materials for commercial use without permission.
        - heading: Services and quotes
          paragraphs:
            - Pricing shown on our website represents starting rates. Final
              scope and price are confirmed in writing before work begins.
            - We reserve the right to decline projects that are outside our
              capacity, unethical, or misaligned with our studio.
        - heading: No guarantee of results
          paragraphs:
            - We build professional websites and set up foundations for search
              visibility, but we do not guarantee specific search rankings,
              traffic levels, or revenue outcomes. Business results depend on
              many factors outside our control.
        - heading: Limitation of liability
          paragraphs:
            - To the fullest extent permitted by law, Halite WebDev is not
              liable for indirect, incidental, or consequential damages arising
              from use of our website or services. Our total liability for any
              claim related to a project is limited to the amount you paid us
              for that project in the twelve months before the claim.
            - Nothing in these Terms limits liability where limitation is not
              permitted by applicable law.
        - heading: Changes
          paragraphs:
            - We may update these Terms from time to time. The "Last updated"
              date at the top will change when we do. Continued use of the site
              after changes constitutes acceptance of the updated Terms.
        - heading: Governing law
          paragraphs:
            - These Terms are governed by the laws of the State of New Mexico,
              without regard to conflict-of-law rules. Disputes shall be brought
              in courts located in Doña Ana County, New Mexico, unless otherwise
              required by law.
        - heading: Contact
          paragraphs:
            - "Questions about these Terms: salsalgadonm@gmail.com or (505)
              373-9851."
    service-agreement:
      lastUpdated: June 27, 2026
      intro: This page summarizes key terms for Halite WebDev website projects and
        monthly plans. A signed agreement may include additional details. This
        summary is provided for transparency before you hire us.
      sections:
        - heading: Parties and scope
          paragraphs:
            - Halite WebDev (Sebastian Salgado) provides website design,
              development, hosting setup, and domain connection for small
              businesses.
            - You (the "Client") provide business information, content, photos,
              logos, and timely feedback needed to complete the project.
        - heading: Upfront (pay-once) projects
          paragraphs:
            - "For upfront packages, you pay the agreed project fee according to
              the payment schedule in your quote (typically a deposit to start
              and balance before or at launch). Founding rates: Starter site
              $500, Full site $750 unless otherwise quoted."
            - "Every build includes the DIY Handoff at no extra cost: your
              complete site files, written instructions, a live 1-hour
              walkthrough, and access to the built-in CMS so you can update your
              own text and photos. There is no monthly plan and no
              subscription."
            - You must register and own your domain name; Halite does not
              purchase domains on your behalf. You share registrar access so we
              can connect your site.
            - Larger changes (new pages, redesigns, major photo work) are quoted
              separately.
        - heading: Monthly financing (6- or 12-month term)
          paragraphs:
            - Monthly financing splits the same one-time build price over a 6-
              or 12-month term to make it easier to get online. It is a payment
              plan, not a subscription—there are no ongoing hosting or care fees
              included, and no lock-in after the term.
            - "Starter site financing: $85/month for 6 months, or $45/month for
              12 months. Full site financing: $130/month for 6 months, or
              $65/month for 12 months. Exact terms are stated in your quote."
            - You may pay off the remaining balance early at any time. Once the
              financed price is paid in full, the site is yours and nothing
              further is owed.
            - If you stop payments before the price is paid off, you remain
              responsible for the remaining build balance as stated in your
              signed agreement.
        - heading: Updating your site yourself
          paragraphs:
            - Every site includes a built-in CMS so you can change your own text
              and photos anytime—hours, prices, a new photo, a menu item, and
              similar updates—without paying for edits.
            - Larger changes such as new pages, redesigns, e-commerce setup, or
              copywriting from scratch are not self-service and are quoted
              separately.
            - If you'd rather I make a change for you, send it over and I'll
              quote it first. Turnaround is typically 3–5 business days unless
              otherwise agreed.
        - heading: Ownership and handoff
          paragraphs:
            - You own the content you provide (your words, logos, photos) and
              must register your domain in your own name with a third-party
              registrar. Halite does not take legal ownership of your domain.
            - Halite builds custom websites tailored to your
              business—lightweight, fast on phones, and straightforward to
              maintain.
            - For upfront projects paid in full, you receive your complete site
              files plus written instructions to redeploy or transfer to another
              host. The DIY Handoff—including the live 1-hour walkthrough and
              CMS access—is included at no extra charge.
            - For financed projects, full ZIP handoff is available once the
              financed price is paid in full or upon early payoff.
            - You always receive your site files and reasonable handoff notes. A
              migration fee may apply for extra hand-holding beyond the standard
              export.
        - heading: Client responsibilities
          paragraphs:
            - You agree to provide accurate business information, respond to
              requests within a reasonable time, and ensure you have rights to
              any images or content you supply.
            - Delays in client feedback may shift launch timelines. We are not
              responsible for launch delays caused by missing content or
              approvals.
        - heading: Solo operator disclosure
          paragraphs:
            - Halite WebDev is operated by Sebastian Salgado as an individual
              studio. You work directly with the builder. Support is provided
              during reasonable business hours—not 24/7 emergency response
              unless explicitly agreed as a paid add-on.
        - heading: Payment and late fees
          paragraphs:
            - Invoices are due on the date stated. Late payments may pause work,
              hosting, or support until the account is current.
            - Monthly plans are billed automatically when card billing is set
              up, or by invoice when agreed.
        - heading: Questions
          paragraphs:
            - "Before signing, ask anything that is unclear. Contact:
              salsalgadonm@gmail.com or (505) 373-9851. We're happy to walk
              through this in plain language on a short call."
